name: Build assets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Rebuild Danny banner only
        run: |
          {
            printf '%s' 'iVBORw0KGgoAAAANSUhEUgAAA5gAAACtCAMAAADiSSAMAAADAFBMVEUDEBsUQT/frVn1+Ps'
            printf 'A%.0s' {1..1007}
            cat mnl-manager-banners/.source/danny-clean-head1 \
                mnl-manager-banners/.source/danny-clean-head2 \
                mnl-manager-banners/.source/danny-custom8.part2 \
                mnl-manager-banners/.source/danny-clean-p3-1 \
                mnl-manager-banners/.source/danny-clean-p3-2 \
                mnl-manager-banners/.source/danny-clean-p3-3 \
                mnl-manager-banners/.source/danny-clean-p3-4 \
                mnl-manager-banners/.source/danny-custom8.part4 \
                mnl-manager-banners/.source/danny-custom8.part5
          } | base64 --decode > mnl-manager-banners/danny-danny.png

          test "$(wc -c < mnl-manager-banners/danny-danny.png)" -eq 26188
          echo "9f9f1e4aa9965f381b81133df60a84a2e31001f7fbec9c0e0fcc1ebe3644ce11  mnl-manager-banners/danny-danny.png" | sha256sum -c -

          node - <<'NODE'
          const sharp = require('sharp');
          (async () => {
            const file = 'mnl-manager-banners/danny-danny.png';
            const m = await sharp(file).metadata();
            if (m.format !== 'png' || m.width !== 920 || m.height !== 173) {
              throw new Error(`expected PNG 920x173, got ${m.format} ${m.width}x${m.height}`);
            }
            console.log(`Danny OK: ${m.format} ${m.width}x${m.height}`);
          })().catch(err => { console.error(err); process.exit(1); });
          NODE
      - name: Publish Danny banner
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mnl-manager-banners/danny-danny.png
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish validated Danny manager banner [skip ci]"
          git push
