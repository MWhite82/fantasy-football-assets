name: Build assets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish Mitch manager banner
        run: |
          mkdir -p manager-banners
          curl -L 'https://oaisdmntprwestus3.blob.core.windows.net/files/00000000-ed94-81fd-aaff-db9144ca620e/raw?se=2026-09-13T11%3A47%3A25Z&sp=r&sv=2026-02-06&sr=b&scid=91d84532-7310-416d-8942-ae368e4e9a92&skoid=5e713cdb-766b-475e-a3ca-8adb6cf99aa0&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-12T23%3A20%3A50Z&ske=2026-09-13T23%3A20%3A50Z&sks=b&skv=2026-02-06&sig=/q7d1wBtpj1Yw2B3eHYQ%2BtOwpZk0O0dWwN3G98EB4Z8%3D' -o manager-banners/mitch-riggitywreckers.jpg
          file manager-banners/mitch-riggitywreckers.jpg
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manager-banners/mitch-riggitywreckers.jpg
          git commit -m 'Repair Mitch manager banner [skip ci]'
          git push
