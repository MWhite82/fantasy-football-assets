name: Build assets

on:
  push:
    branches: [main]
    paths:
      - 'build.js'
      - 'package.json'
      - 'netlify.toml'
      - '.github/workflows/build-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish selected Mitch banner
        run: |
          mkdir -p manager-banners
          curl -L 'https://oaisdmntprwestus3.blob.core.windows.net/files/00000000-d448-81fd-b6bc-42ca2be5cd33/raw?se=2026-09-13T14%3A35%3A01Z&sp=r&sv=2026-02-06&sr=b&scid=2383b90e-b94d-4b17-bcea-7a4fdb6e940f&skoid=5e713cdb-766b-475e-a3ca-8adb6cf99aa0&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-13T14%3A11%3A41Z&ske=2026-09-14T14%3A11%3A41Z&sks=b&skv=2026-02-06&sig=s4k4MIfgzKqgmyz/Up5v%2B8e1CyanOIwGfHPOBBV2EVA%3D' -o manager-banners/mitch-riggitywreckers.png
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manager-banners/mitch-riggitywreckers.png
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish selected Mitch manager banner [skip ci]"
          git push
