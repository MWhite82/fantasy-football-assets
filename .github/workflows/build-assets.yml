name: Build assets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-assets.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Danny Phase 2B reconstruction validation
        run: |
          cat mnl-manager-banners/.source/danny-approved-20260918.part[0-9][0-9][0-9] \
            | base64 --decode > /tmp/danny-phase2b.png

          test "$(wc -c < /tmp/danny-phase2b.png)" -eq 300812
          echo "1b2f433bc3f8317ad3d51891e96040fad74323430c39286c14195264e4de6458  /tmp/danny-phase2b.png" | sha256sum -c -

          node - <<'NODE'
          const sharp = require('sharp');
          (async () => {
            const file = '/tmp/danny-phase2b.png';
            const m = await sharp(file).metadata();
            if (m.format !== 'png' || m.width !== 920 || m.height !== 173) {
              throw new Error(`expected PNG 920x173, got ${m.format} ${m.width}x${m.height}`);
            }
            await sharp(file).raw().toBuffer();
            console.log(`Danny Phase 2B PASS: ${m.format} ${m.width}x${m.height}; full decode succeeded`);
          })().catch(err => { console.error(err); process.exit(1); });
          NODE
