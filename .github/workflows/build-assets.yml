name: Build assets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Rebuild Drew banner only
        run: |
          {
            head -c 8000 mnl-manager-banners/.source/drew-custom8.part1
            cat mnl-manager-banners/.source/drew-custom8.part2 \
                mnl-manager-banners/.source/drew-custom8.part3 \
                mnl-manager-banners/.source/drew-custom8.part4 \
                mnl-manager-banners/.source/drew-custom8.part5
          } | base64 --decode > mnl-manager-banners/drew-wet-bandits.png

          test "$(wc -c < mnl-manager-banners/drew-wet-bandits.png)" -eq 26085
          echo "30b5fa192543aefc1c930027a68a3fd82968a444269ff73d730f8dd98d0bfd97  mnl-manager-banners/drew-wet-bandits.png" | sha256sum -c -

          node - <<'NODE'
          const sharp = require('sharp');
          (async () => {
            const file = 'mnl-manager-banners/drew-wet-bandits.png';
            const m = await sharp(file).metadata();
            if (m.format !== 'png' || m.width !== 920 || m.height !== 173) {
              throw new Error(`expected PNG 920x173, got ${m.format} ${m.width}x${m.height}`);
            }
            console.log(`Drew OK: ${m.format} ${m.width}x${m.height}`);
          })().catch(err => { console.error(err); process.exit(1); });
          NODE
      - name: Publish Drew banner
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mnl-manager-banners/drew-wet-bandits.png
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish validated Drew manager banner [skip ci]"
          git push
