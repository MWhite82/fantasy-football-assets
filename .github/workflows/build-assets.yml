name: Build assets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish native-ratio Mitch banner
        run: |
          mkdir -p manager-banners
          curl -L 'https://oaisdmntprwestus3.blob.core.windows.net/files/00000000-2cb8-81fd-8f5a-895502371f56/raw?se=2026-09-13T14%3A49%3A36Z&sp=r&sv=2026-02-06&sr=b&scid=194e999c-0d71-4cd9-bbc6-43188ea1bd23&skoid=5e713cdb-766b-475e-a3ca-8adb6cf99aa0&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-13T13%3A45%3A44Z&ske=2026-09-14T13%3A45%3A44Z&sks=b&skv=2026-02-06&sig=lQO45ue7Iggl/ZG6fiXE0JpwgbnuhPFbh%2ByvbJLEDok%3D' -o manager-banners/mitch-riggitywreckers.png
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manager-banners/mitch-riggitywreckers.png
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish native-ratio Mitch manager banner [skip ci]"
          git push
