name: Build assets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish corrected Mitch banner
        run: |
          mkdir -p manager-banners
          curl -L 'https://oaisdmntprwestus3.blob.core.windows.net/files/00000000-a768-81fd-8c45-140f384fd39e/raw?se=2026-09-13T14%3A47%3A44Z&sp=r&sv=2026-02-06&sr=b&scid=194e999c-0d71-4cd9-bbc6-43188ea1bd23&skoid=5e713cdb-766b-475e-a3ca-8adb6cf99aa0&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-13T13%3A31%3A34Z&ske=2026-09-14T13%3A31%3A34Z&sks=b&skv=2026-02-06&sig=g2CtIx1i3SP2AOq%2ByvbrkXyoAz6Tw/mOgzCG6wgirvI%3D' -o manager-banners/mitch-riggitywreckers.png
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manager-banners/mitch-riggitywreckers.png
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Replace Mitch banner with corrected aspect ratio [skip ci]"
          git push
