name: Build assets

on:
  push:
    branches: [main]
    paths:
      - 'build.js'
      - 'package.json'
      - 'netlify.toml'
      - '.github/workflows/build-assets.yml'
      - 'mnl-manager-banners/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: node build.js
      - name: Convert MNL manager banner to PNG
        run: |
          python -m pip install pillow
          python - <<'PY'
          from PIL import Image, ImageFile
          ImageFile.LOAD_TRUNCATED_IMAGES = True
          src='mnl-manager-banners/mitch-w-riggitywreckers.jpg'
          dst='mnl-manager-banners/mitch-w-riggitywreckers.png'
          with Image.open(src) as im:
              im.convert('RGB').save(dst, 'PNG', optimize=True)
          PY
      - name: Publish generated assets to repository root
        run: |
          cp dist/mnl-header.png mnl-header.png
          cp dist/mnl-glance.png mnl-glance.png
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mnl-header.png mnl-glance.png manager-banners/mitch-riggitywreckers.png mnl-manager-banners/mitch-w-riggitywreckers.png
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Build fantasy football image assets [skip ci]"
          git push
