name: Build assets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download full-resolution approved assets
        run: |
          curl -L 'https://oaisdmntprwestus3.blob.core.windows.net/files/00000000-4024-81fd-8b72-7fa9f071f562/raw?se=2026-09-13T02%3A55%3A49Z&sp=r&sv=2026-02-06&sr=b&scid=3333c3a6-5916-431e-9224-695001cc1060&skoid=5e713cdb-766b-475e-a3ca-8adb6cf99aa0&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-13T00%3A18%3A50Z&ske=2026-09-14T00%3A18%3A50Z&sks=b&skv=2026-02-06&sig=dGeGBwQroYpzrNCAMqDVzM%2BJKV1GJrT5Br2Sbvq/3Gg%3D' -o mnl-overview-final-hd.png
          curl -L 'https://oaisdmntprwestus3.blob.core.windows.net/files/00000000-9f80-81fd-99b0-6c880efaf04b/raw?se=2026-09-13T02%3A55%3A49Z&sp=r&sv=2026-02-06&sr=b&scid=3333c3a6-5916-431e-9224-695001cc1060&skoid=5e713cdb-766b-475e-a3ca-8adb6cf99aa0&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-13T02%3A38%3A56Z&ske=2026-09-14T02%3A38%3A56Z&sks=b&skv=2026-02-06&sig=Z8GV63EZheFVgkPubi1/yTA6l6tKghLHPp0Q6eTkcPg%3D' -o mnl-glance-final-hd.png
          file mnl-overview-final-hd.png
          file mnl-glance-final-hd.png
      - name: Commit full-resolution assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mnl-overview-final-hd.png mnl-glance-final-hd.png
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add full-resolution Monday Night Lights assets [skip ci]"
          git push
